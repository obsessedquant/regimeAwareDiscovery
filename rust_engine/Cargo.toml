[package]
name = "rust_engine"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
polars = { version = "0.43", features = ["lazy", "parquet", "csv", "strings"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"